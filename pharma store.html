<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صيدليتي | إدارة الصيدلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{
/* ===== تحديث الصلاحيات والتمرير والحماية بكلمة مرور المستخدم ===== */
(function(){
  const PERM_LABELS={
    dashboard:'لوحة التشغيل اليومية',sales:'المبيعات والفواتير',inventory:'المخزون والأدوية',
    purchases:'المشتريات والتوريد',suppliers:'الموردون',accounts:'حسابات الموردين',
    returns:'المرتجعات',expenses:'المصروفات',customers:'العملاء والآجل',
    stocktake:'الجرد والتسويات',shifts:'الورديات والتقفيل',reports:'التقارير',
    users:'المستخدمون والصلاحيات',settings:'الإعدادات',activity:'سجل الحركة',
    sale_complete:'إتمام/إغلاق الفاتورة',pdf:'تصدير PDF',excel:'تصدير Excel',
    print:'الطباعة',shift_close:'التقفيل اليومي',whatsapp:'مشاركة واتساب'
  };
  const ALL_PERMS=Object.keys(PERM_LABELS);

  function normalizeUserPermissions(u){
    if(u.role==='مدير' || !u.permissions || u.permissions==='all') u.permissions=[...ALL_PERMS];
    else if(!Array.isArray(u.permissions)){
      const roleDefaults={
        'صيدلي':['dashboard','sales','inventory','purchases','suppliers','accounts','returns','expenses','customers','stocktake','reports','settings','activity','sale_complete','pdf','excel','print'],
        'كاشير':['dashboard','sales','customers','sale_complete','print']
      };
      u.permissions=[...(roleDefaults[u.role]||['dashboard','sales'])];
    }
    return u;
  }
  data.users=(data.users||[]).map(normalizeUserPermissions);
  const currentUser=()=>data.users.find(u=>u.username===data.loginUsername)||data.users.find(u=>u.name===data.user);
  const hasPerm=(p)=>{
    const u=currentUser();
    return u.role==='مدير' || (Array.isArray(u.permissions)&&u.permissions.includes(p));
  };
  window.currentUserForPermissions=currentUser;
  window.hasPermission=(p)=>data.role==='مدير'||hasPerm(p);

  /* استبدال التحقق القديم بصلاحيات المستخدم الفعلية */
  can=function(permission){
    return hasPerm(permission);
  };
  requirePermission=function(permission){
    if(hasPerm(permission)) return true;
    toast('هذا المستخدم لا يملك صلاحية: '+(PERM_LABELS[permission]||permission));
    return false;
  };

  function askOwnPassword(title, action, onOk){
    if(!hasPerm(action)){ toast('لا توجد صلاحية لتنفيذ '+(PERM_LABELS[action]||action)); return; }
    const u=currentUser();
    if(!u){toast('تعذر تحديد المستخدم الحالي');return;}
    showModal('تأكيد كلمة مرور المستخدم',`
      <p class="muted">لتنفيذ <b>${esc(PERM_LABELS[action]||action)}</b>، أدخل كلمة مرور حسابك.</p>
      <div class="field"><label>المستخدم</label><input class="input" value="${esc(u.username)}" disabled></div>
      <div class="field"><label>كلمة المرور</label><input id="actionPassword" class="input" type="password" autocomplete="current-password"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="verifyOwnPassword()">تأكيد وتنفيذ</button>
        <button class="btn btn-soft" onclick="closeModal()">إلغاء</button>
      </div>`);
    window.__pendingPasswordAction={userId:u.id,action,onOk};
    setTimeout(()=>document.getElementById('actionPassword')?.focus(),50);
  }
  window.verifyOwnPassword=function(){
    const p=document.getElementById('actionPassword')?.value||'';
    const ctx=window.__pendingPasswordAction;
    const u=ctx&&data.users.find(x=>x.id===ctx.userId);
    if(!u||u.password!==p){toast('كلمة المرور غير صحيحة');return}
    const cb=ctx.onOk; window.__pendingPasswordAction=null; closeModal(); audit('تأكيد بكلمة المرور',PERM_LABELS[ctx.action]||ctx.action); save();
    setTimeout(cb,0);
  };
  window.askOwnPassword=askOwnPassword;

  /* حفظ اسم المستخدم الحالي حتى لا تختلط صلاحيات الحسابات */
  const oldActivate=activate;
  activate=async function(e){
    e.preventDefault();
    const login=(document.getElementById('username')?.value||'').trim();
    const user=data.users.find(x=>x.active&&x.username===login&&x.password===document.getElementById('password').value);
    if(!user||!isValidLicenseCode(document.getElementById('license').value)){toast('كود التفعيل غير صحيح أو منتهي');return}
    normalizeUserPermissions(user);
    data.loginUsername=user.username;
    data.activated=true;data.user=user.name;data.role=user.role;
    save();document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render();
  };

  /* حماية إتمام الفاتورة بكلمة مرور نفس المستخدم */
  const oldCompleteSale=completeSale;
  completeSale=function(){
    if(!data.cart.length)return;
    if(!hasPerm('sale_complete')){toast('لا توجد صلاحية لإغلاق/إتمام الفاتورة');return}
    askOwnPassword('تأكيد إغلاق الفاتورة','sale_complete',()=>oldCompleteSale());
  };

  /* PDF محمي بكلمة مرور المستخدم */
  const oldExportPdf=exportCurrentPdf;
  exportCurrentPdf=function(){
    askOwnPassword('تصدير PDF','pdf',()=>oldExportPdf());
  };
  const oldPrintReport=printReport;
  printReport=function(){
    askOwnPassword('طباعة التقرير / PDF','pdf',()=>oldPrintReport());
  };

  /* Excel والطباعة العامة حسب الصلاحية */
  const oldDownloadExcel=downloadExcel;
  downloadExcel=function(message){
    if(!hasPerm('excel')){toast('لا توجد صلاحية لتصدير Excel');return}
    askOwnPassword('تصدير Excel','excel',()=>oldDownloadExcel(message));
  };
  const oldPrintShiftReport=printShiftReport;
  printShiftReport=function(shift){
    if(!hasPerm('pdf')){toast('لا توجد صلاحية لطباعة تقرير التقفيل');return}
    askOwnPassword('طباعة تقرير التقفيل','pdf',()=>oldPrintShiftReport(shift));
  };

  /* حماية التقفيل اليومي بكلمة المرور */
  const oldCloseShift=closeShift;
  closeShift=function(){
    if(!data.activeShift){toast('لا توجد وردية مفتوحة');return}
    if(!hasPerm('shift_close')){toast('لا توجد صلاحية للتقفيل اليومي');return}
    askOwnPassword('التقفيل اليومي','shift_close',()=>oldCloseShift());
  };

  /* منع زر فتح الوردية للمستخدم غير المسموح له */
  const oldOpenShift=openShift;
  openShift=function(){
    if(!hasPerm('shifts')){toast('لا توجد صلاحية لإدارة الورديات');return}
    oldOpenShift();
  };

  /* شاشة المستخدمين: صلاحيات فردية قابلة للتحديد */
  renderUsers=function(){
    if(!hasPerm('users')){current='dashboard';return renderDashboard()}
    document.getElementById('view').innerHTML=head('المستخدمون والصلاحيات','حدد لكل مستخدم ما يظهر له وما يستطيع تنفيذه')+
    `<div class="card permissions-card">
      <div class="table-wrap"><table class="table"><thead><tr>
      <th>المستخدم</th><th>الدور</th><th>صلاحيات الشاشة</th><th>صلاحيات حساسة</th><th>الحالة</th><th></th>
      </tr></thead><tbody>${data.users.map((u,i)=>{
        normalizeUserPermissions(u);
        const screens=ALL_PERMS.filter(k=>!['sale_complete','pdf','excel','print','shift_close'].includes(k)&&u.permissions.includes(k)).length;
        const sensitive=['sale_complete','pdf','excel','print','shift_close'].filter(k=>u.permissions.includes(k)).length;
        return `<tr><td><b>${esc(u.name)}</b><br><small class="muted">${esc(u.username)}</small></td>
        <td><span class="status info">${esc(u.role)}</span></td>
        <td>${u.role==='مدير'?'كل الشاشات':screens+' شاشة'}</td>
        <td>${u.role==='مدير'?'كل العمليات':sensitive+' عمليات'}</td>
        <td><span class="status ${u.active?'ok':'out'}">${u.active?'نشط':'موقوف'}</span></td>
        <td><button class="btn btn-primary" style="padding:6px 9px" onclick="editUserPermissions(${i})">الصلاحيات</button>
        <button class="btn btn-soft" style="padding:6px 9px" onclick="toggleUser(${i})">${u.active?'إيقاف':'تفعيل'}</button>
        ${u.username!=='admin'?`<button class="btn btn-danger" style="padding:6px" onclick="removeUser(${i})"><i data-lucide="trash-2"></i></button>`:''}</td></tr>`;
      }).join('')}</tbody></table></div>
      <div class="actions" style="margin-top:15px"><button class="btn btn-primary" onclick="userModal()"><i data-lucide="user-plus"></i> إضافة مستخدم</button></div>
    </div>`;
    icon();
  };

  editUserPermissions=function(i){
    const u=data.users[i]; normalizeUserPermissions(u);
    const groups=[
      ['شاشات النظام',['dashboard','sales','inventory','purchases','suppliers','accounts','returns','expenses','customers','stocktake','shifts','reports','users','settings','activity']],
      ['عمليات حساسة',['sale_complete','pdf','excel','print','shift_close','whatsapp']]
    ];
    const checks=(keys)=>keys.map(k=>`<label class="permission-item"><input type="checkbox" class="perm-check" value="${k}" ${u.permissions.includes(k)?'checked':''} ${u.role==='مدير'?'disabled':''}><span>${esc(PERM_LABELS[k])}</span></label>`).join('');
    showModal('صلاحيات: '+esc(u.name),`
      <div class="permission-note">حدد ما يظهر للمستخدم وما يستطيع تنفيذه. المدير الرئيسي لديه كل الصلاحيات دائماً.</div>
      ${groups.map(g=>`<div class="permission-group"><h3>${g[0]}</h3><div class="permission-grid">${checks(g[1])}</div></div>`).join('')}
      <div class="modal-actions"><button class="btn btn-primary" onclick="saveUserPermissions(${i})">حفظ الصلاحيات</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`);
  };

  saveUserPermissions=function(i){
    if(!hasPerm('users'))return;
    const u=data.users[i];
    if(u.role!=='مدير') u.permissions=[...document.querySelectorAll('.perm-check:checked')].map(x=>x.value);
    else u.permissions=[...ALL_PERMS];
    save();closeModal();renderUsers();toast('تم حفظ صلاحيات المستخدم');
  };

  const oldUserModal=userModal;
  userModal=function(){
    showModal('إضافة مستخدم',`
      <div class="form-grid"><div class="field"><label>الاسم</label><input id="uName" class="input"></div>
      <div class="field"><label>اسم المستخدم</label><input id="uLogin" class="input"></div>
      <div class="field"><label>كلمة المرور</label><input id="uPass" class="input" type="password"></div>
      <div class="field"><label>الدور الأساسي</label><select id="uRole" class="input"><option>صيدلي</option><option>كاشير</option><option>مدير</option></select></div></div>
      <p class="hint" style="text-align:right">بعد الحفظ افتح "الصلاحيات" لتحديد كل شاشة وكل عملية بشكل منفصل.</p>
      <div class="modal-actions"><button class="btn btn-primary" onclick="saveUserWithPermissions()">حفظ المستخدم</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`);
  };
  saveUserWithPermissions=function(){
    if(!hasPerm('users'))return;
    const user={id:Date.now(),name:uName.value.trim(),username:uLogin.value.trim(),password:uPass.value,role:uRole.value,active:true,permissions:[]};
    if(!user.name||!user.username||!user.password){toast('أكمل بيانات المستخدم');return}
    if(data.users.some(x=>x.username===user.username)){toast('اسم المستخدم موجود بالفعل');return}
    normalizeUserPermissions(user); if(user.role==='مدير')user.permissions=[...ALL_PERMS];
    data.users.push(user);save();closeModal();renderUsers();toast('تمت إضافة المستخدم');
  };

  /* إخفاء الشاشات والأزرار غير المسموح بها */
  const oldRender=render;
  render=function(){
    if(!hasPerm(current)) current='dashboard';
    oldRender();
    document.querySelectorAll('#nav button').forEach(b=>{
      const p=b.dataset.page;
      b.style.display=hasPerm(p)?'flex':'none';
    });
    const hide=(selector,ok)=>document.querySelectorAll(selector).forEach(el=>el.style.display=ok?'':'none');
    hide('#utilityPdf',hasPerm('pdf'));
    hide('#utilityExcel',hasPerm('excel'));
    if(current==='dashboard')document.getElementById('view')?.classList.add('dashboard-page');
  };

  /* حماية زر PDF داخل التقارير حتى لو تم استدعاؤه مباشرة */
  const oldShareReportsWhatsApp=shareReportsWhatsApp;
  shareReportsWhatsApp=function(){ if(!hasPerm('reports'))return toast('لا توجد صلاحية للتقارير'); oldShareReportsWhatsApp(); };
  const oldShareCurrentWhatsApp=shareCurrentWhatsApp;
  shareCurrentWhatsApp=function(){if(!hasPerm('whatsapp'))return toast('لا توجد صلاحية لمشاركة واتساب');oldShareCurrentWhatsApp();};
  const oldShareCartWhatsApp=shareCartWhatsApp;
  shareCartWhatsApp=function(){if(!hasPerm('whatsapp'))return toast('لا توجد صلاحية لمشاركة واتساب');oldShareCartWhatsApp();};

  /* عند تسجيل الخروج ننسى المستخدم الحالي فقط */
  const oldLogout=logout;
  logout=function(){data.loginUsername='';oldLogout();};

  /* تنسيق تمرير لوحة التشغيل والنظام */
  const st=document.createElement('style');
  st.textContent=`
    html,body{overflow:hidden!important}
    .app{height:100dvh!important;min-height:0!important;overflow:hidden!important}
    .main{height:100%!important;min-height:0!important;overflow-y:scroll!important;overflow-x:hidden!important;scrollbar-gutter:stable both-edges!important;overscroll-behavior:contain!important;padding-bottom:90px!important}
    #view.dashboard-page{min-height:max-content!important;padding-bottom:35px}
    .dashboard-page .dashboard-grid{align-items:start}
    .dashboard-page .card{min-height:0}
    .sidebar{overflow-y:auto!important;overflow-x:hidden!important;scrollbar-gutter:stable}
    .permissions-card{overflow:hidden}
    .permission-note{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:12px;margin-bottom:14px}
    .permission-group{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
    .permission-group h3{font-size:13px;margin:0 0 10px}
    .permission-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .permission-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:11px;cursor:pointer}
    .permission-item input{accent-color:var(--teal)}
    @media(min-width:701px){.main::-webkit-scrollbar{width:11px}.main::-webkit-scrollbar-track{background:transparent}.main::-webkit-scrollbar-thumb{background:#7f9aa780;border-radius:20px}.main::-webkit-scrollbar-thumb:hover{background:#168f9180}}
    @media(max-width:700px){html,body{overflow:auto!important}.app{height:auto!important;overflow:visible!important}.main{height:auto!important;overflow:visible!important}.permission-grid{grid-template-columns:1fr}.dashboard-page{padding-bottom:20px}}
  `;
  document.head.appendChild(st);
  data.users.forEach(normalizeUserPermissions);
  save();
  if(window.directUsersRenderer) renderUsers=window.directUsersRenderer;
  if(window.directEditUserPermissions) window.editUserPermissions=window.directEditUserPermissions;
  if(window.directSaveUserPermissions) window.saveDirectPermissions=window.directSaveUserPermissions;
})();});

</script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>

function isValidLicenseCode(value){const code=String(value||'').trim().toUpperCase(),part='[A-HJ-NP-Z2-9]{10}',permanent=new RegExp('^SPOS-P-'+part+'$'),temporary=new RegExp('^SPOS-T-(\\d{8})-'+part+'$');if(permanent.test(code))return true;const match=code.match(temporary);if(!match)return false;const year=Number(match[1].slice(0,4)),month=Number(match[1].slice(4,6)),day=Number(match[1].slice(6,8)),expiry=new Date(year,month-1,day,23,59,59,999);return expiry.getFullYear()===year&&expiry.getMonth()===month-1&&expiry.getDate()===day&&Date.now()<=expiry.getTime()}
function can(permission){return data.role==='مدير'||(data.role==='صيدلي'&&permission!=='users')||(data.role==='كاشير'&&permission==='sales')}function requirePermission(permission){if(can(permission))return true;toast('ليس لديك صلاحية لتنفيذ هذه العملية');return false}

function workbook(){const rows=[['الصنف','التصنيف','الوحدة','السعر','المخزون','الحد الأدنى','الصلاحية'],...data.products.map(p=>[p.name,p.category,p.unit,p.price,p.stock,p.min,p.expiry])];const sales=[['رقم الفاتورة','التاريخ','الإجمالي','طريقة الدفع'],...data.sales.map(s=>[s.id,s.date,s.total,s.payment])];const shifts=[['رقم الشفت','البداية','النهاية','الرصيد الافتتاحي','المتوقع','الفعلي','الفرق'],...data.shifts.map(s=>[s.id,s.openedAt,s.closedAt,s.opening,s.expected,s.actual,s.difference])];const users=[['الاسم','اسم المستخدم','الدور','الحالة'],...data.users.map(u=>[u.name,u.username,u.role,u.active?'نشط':'موقوف'])];const wb=XLSX.utils.book_new();[['الأدوية',rows],['المبيعات',sales],['الورديات',shifts],['المستخدمون',users]].forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n));return wb}
async function syncGoogleSheet(){if(!GOOGLE_SHEET_URL||GOOGLE_SHEET_URL.includes('ضع_رابط')){googleSyncState='الرابط غير مضبوط';updateUtilityBar();return false}if(googleSyncInFlight){googleSyncQueued=true;return false}googleSyncInFlight=true;googleSyncState='جاري الحفظ';updateUtilityBar();const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);try{await fetch(GOOGLE_SHEET_URL,{method:'POST',mode:'no-cors',keepalive:true,signal:controller.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({source:'صيدليتي',savedAt:new Date().toISOString(),data})});googleSyncState='متصل دائماً';googleLastSync=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});googleRetryDelay=5000;return true}catch(error){googleSyncState='إعادة محاولة تلقائية';scheduleGoogleRetry();return false}finally{clearTimeout(timeout);googleSyncInFlight=false;updateUtilityBar();if(googleSyncQueued){googleSyncQueued=false;queueGoogleSync()}}}
function queueGoogleSync(){clearTimeout(googleSyncTimer);googleSyncTimer=setTimeout(()=>syncGoogleSheet(),450)}
function scheduleGoogleRetry(){clearTimeout(googleRetryTimer);googleRetryTimer=setTimeout(()=>syncGoogleSheet(),googleRetryDelay);googleRetryDelay=Math.min(60000,googleRetryDelay*2)}

function renderDashboard(){const today=new Date().toDateString(),todaySales=data.sales.filter(s=>new Date(s.date).toDateString()===today),revenue=todaySales.reduce((a,s)=>a+s.total,0),low=data.products.filter(p=>p.stock<=p.min),totalStock=data.products.reduce((a,p)=>a+p.stock,0);document.getElementById('view').innerHTML=head('نظرة عامة','ملخص تشغيل الصيدلية اليوم',`<button class="btn btn-primary" onclick="openShift()"><i data-lucide="play"></i> فتح وردية</button>`)+`<div class="grid metrics"><div class="metric"><div class="metric-top">مبيعات اليوم <span class="metric-icon"><i data-lucide="banknote"></i></span></div><b>${money(revenue)}</b><small>${todaySales.length} فاتورة مكتملة</small></div><div class="metric"><div class="metric-top">عدد الأصناف <span class="metric-icon"><i data-lucide="package"></i></span></div><b>${data.products.length}</b><small>${totalStock} وحدة بالمخزن</small></div><div class="metric"><div class="metric-top">نواقص المخزون <span class="metric-icon"><i data-lucide="triangle-alert"></i></span></div><b class="${low.length?'danger-text':''}">${low.length}</b><small>تحتاج إلى توريد</small></div><div class="metric"><div class="metric-top">حالة الوردية <span class="metric-icon"><i data-lucide="clock-3"></i></span></div><b>${data.activeShift?'مفتوحة':'مغلقة'}</b><small>${data.activeShift?'جاهزة للبيع':'ابدأ وردية جديدة'}</small></div></div><div class="grid dashboard-grid"><section class="card"><h2>آخر المبيعات</h2><div class="table-wrap"><table class="table"><thead><tr><th>الفاتورة</th><th>الوقت</th><th>طريقة الدفع</th><th>الإجمالي</th></tr></thead><tbody>${data.sales.slice(-6).reverse().map(s=>`<tr><td>#${s.id}</td><td>${new Date(s.date).toLocaleString('ar-EG')}</td><td><span class="status info">${s.payment==='card'?'بطاقة':'نقدي'}</span></td><td>${money(s.total)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد مبيعات مسجلة</td></tr>'}</tbody></table></div></section><section class="card"><h2>تنبيهات سريعة</h2><div class="list">${low.slice(0,5).map(p=>`<div class="list-item"><span>${esc(p.name)}<small class="muted"><br>متاح ${p.stock} من ${p.min}</small></span><span class="status low">توريد</span></div>`).join('')||'<div class="empty">المخزون مستقر حالياً</div>'}</div></section></div>`}

function productCards(list){return list.map(p=>`<button class="product" onclick="addCart(${p.id})" ${p.stock<1?'disabled':''}><span class="product-tag">${esc(p.unit||'وحدة')}</span><b>${esc(p.name)}</b><small>${esc(p.category)}</small><strong>${money(p.price)} <em>/ ${esc(p.unit||'وحدة')}</em></strong><small class="${p.stock<=p.min?'danger-text':''}">المتاح: ${p.stock} ${esc(p.unit||'وحدة')}</small></button>`).join('')||'<div class="empty">لا توجد أصناف</div>'}function cartLines(){return data.cart.length?data.cart.map((x,i)=>`<div class="cart-row"><span>${esc(x.name)}<small class="muted"><br>${money(x.price)} / ${esc(x.unit||'وحدة')}</small></span><span class="qty"><button onclick="changeCart(${i},-1)">−</button>${x.qty}<button onclick="changeCart(${i},1)">+</button></span><span class="cart-unit">${esc(x.unit||'وحدة')}</span><button class="btn btn-danger" style="padding:5px" onclick="removeCart(${i})"><i data-lucide="trash-2"></i></button></div>`).join(''):'<div class="empty">السلة فارغة<br><small>اختر دواءً لإضافته للفاتورة</small></div>'}function totalLines(){const total=data.cart.reduce((a,x)=>a+x.price*x.qty,0);return `<div class="total-line"><span>عدد الوحدات</span><b>${data.cart.reduce((a,x)=>a+x.qty,0)}</b></div><div class="total-line total"><span>الإجمالي</span><b>${money(total)}</b></div>`}

function changeCart(i,n){const line=data.cart[i],p=data.products.find(x=>x.id===line.id);line.qty+=n;if(line.qty>p.stock)line.qty=p.stock;if(line.qty<1)data.cart.splice(i,1);save();renderSales()}function removeCart(i){data.cart.splice(i,1);save();renderSales()}

function saveSale(){if(!requirePermission('sales'))return;const total=data.cart.reduce((a,x)=>a+x.price*x.qty,0),payment=document.getElementById('payment').value;if(!data.activeShift){toast('افتح وردية قبل تسجيل المبيعات');closeModal();return}data.cart.forEach(x=>{const p=data.products.find(p=>p.id===x.id);p.stock-=x.qty});data.sales.push({id:String(Date.now()).slice(-7),date:new Date().toISOString(),total,payment,items:data.cart.map(x=>({...x}))});if(payment==='cash')data.activeShift.cash+=total;data.cart=[];save();closeModal();downloadExcel('تم حفظ الفاتورة وتحديث ملف Excel');renderSales()}
function printCart(){if(!data.cart.length){toast('السلة فارغة');return}const total=data.cart.reduce((a,x)=>a+x.price*x.qty,0),w=window.open('','_blank','width=420,height=600');if(w){w.document.write(`<html dir="rtl"><body style="font-family:Tahoma;padding:24px"><h2>صيدليتي</h2><p>${new Date().toLocaleString('ar-EG')}</p>${data.cart.map(x=>`<p>${esc(x.name)} × ${x.qty} : ${money(x.price*x.qty)}</p>`).join('')}<hr><h3>الإجمالي: ${money(total)}</h3><script>window.print()<\/script></body></html>`);w.document.close()}}
function renderInventory(){document.getElementById('view').innerHTML=head('المخزون والأدوية','إدارة الكميات، الأسعار، الصلاحية والتنبيهات',`<button class="btn btn-primary" onclick="addProductModal()"><i data-lucide="plus"></i> إضافة دواء</button>`)+`<div class="card"><div class="toolbar"><input class="input" placeholder="بحث في الأدوية..." oninput="filterInventory(this.value)"><span class="muted">${data.products.length} أصناف مسجلة</span></div><div class="table-wrap" id="inventoryTable">${inventoryTable(data.products)}</div></div>`}function inventoryTable(list){return `<table class="table"><thead><tr><th>الدواء</th><th>التصنيف</th><th>السعر</th><th>المتاح</th><th>الصلاحية</th><th>الحالة</th><th></th></tr></thead><tbody>${list.map((p,i)=>`<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.unit)}</small></td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.stock} <button class="btn btn-soft" style="padding:4px 7px" onclick="adjustStock(${p.id})">تعديل</button></td><td>${p.expiry}</td><td><span class="status ${p.stock<1?'out':p.stock<=p.min?'low':'ok'}">${p.stock<1?'نفد':p.stock<=p.min?'منخفض':'متوفر'}</span></td><td><button class="btn btn-danger" style="padding:6px" onclick="deleteProduct(${p.id})"><i data-lucide="trash-2"></i></button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد أدوية</td></tr>'}</tbody></table>`}function filterInventory(q){document.getElementById('inventoryTable').innerHTML=inventoryTable(data.products.filter(p=>(p.name+' '+p.category).includes(q.trim())));icon()}
function addProductModal(){showModal('إضافة دواء جديد',`<div class="form-grid"><div class="field"><label>اسم الدواء</label><input id="pName" class="input"></div><div class="field"><label>التصنيف</label><input id="pCat" class="input"></div><div class="field"><label>وحدة البيع بالتجزئة</label><select id="pUnit" class="input"><option>علبة</option><option>شريط</option><option>قرص</option><option>زجاجة</option><option>قطعة</option></select></div><div class="field"><label>سعر الوحدة</label><input id="pPrice" class="input" type="number" min="0" step="0.01"></div><div class="field"><label>الكمية المتاحة</label><input id="pStock" class="input" type="number" min="0" step="1"></div><div class="field"><label>حد التنبيه</label><input id="pMin" class="input" type="number" min="0" value="5"></div><div class="field"><label>تاريخ الصلاحية</label><input id="pExpiry" class="input" type="date"></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="saveProduct()">حفظ الدواء</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}function saveProduct(){if(!requirePermission('inventory'))return;const p={id:Date.now(),name:pName.value.trim(),category:pCat.value.trim()||'عام',unit:pUnit.value||'علبة',price:Number(pPrice.value),stock:Number(pStock.value),min:Number(pMin.value),expiry:pExpiry.value||'غير محدد'};if(!p.name||p.price<0||p.stock<0){toast('أكمل بيانات الدواء بصورة صحيحة');return}data.products.push(p);save();closeModal();renderInventory();downloadExcel('تمت إضافة الدواء وتحديث ملف Excel')}function adjustStock(id){const p=data.products.find(x=>x.id===id),v=prompt('الكمية الجديدة لـ '+p.name+' ('+(p.unit||'وحدة')+')',p.stock);if(v===null)return;p.stock=Math.max(0,Number(v)||0);save();renderInventory();downloadExcel('تم تحديث المخزون')}function deleteProduct(id){if(!confirm('حذف هذا الدواء من القائمة؟'))return;data.products=data.products.filter(p=>p.id!==id);save();renderInventory()}
function renderPurchases(){document.getElementById('view').innerHTML=head('المشتريات والتوريد','سجّل التوريد ليتم تحديث المخزون تلقائياً',`<button class="btn btn-primary" onclick="purchaseModal()"><i data-lucide="plus"></i> تسجيل توريد</button>`)+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>رقم الحركة</th><th>التاريخ</th><th>المورد</th><th>الأصناف</th><th>الإجمالي</th></tr></thead><tbody>${data.purchases.slice(-12).reverse().map(x=>`<tr><td>#${x.id}</td><td>${new Date(x.date).toLocaleString('ar-EG')}</td><td>${esc(x.supplier)}</td><td>${x.lines.length}</td><td>${money(x.total)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد حركات توريد</td></tr>'}</tbody></table></div></div>`}function purchaseModal(){showModal('تسجيل توريد',`<div class="field"><label>الدواء</label><select id="buyProduct" class="input">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>الكمية</label><input id="buyQty" class="input" type="number" value="1"></div><div class="field"><label>تكلفة الوحدة</label><input id="buyPrice" class="input" type="number" value="0"></div><div class="field"><label>المورد</label><input id="buySupplier" class="input"></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="savePurchase()">حفظ التوريد</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}function savePurchase(){const p=data.products.find(x=>x.id==buyProduct.value),qty=Number(buyQty.value),price=Number(buyPrice.value);if(!p||qty<=0||price<0){toast('تحقق من بيانات التوريد');return}p.stock+=qty;data.purchases.push({id:String(Date.now()).slice(-7),date:new Date().toISOString(),supplier:buySupplier.value||'غير محدد',lines:[{name:p.name,qty}],total:qty*price});save();closeModal();renderPurchases();downloadExcel('تم تسجيل التوريد وتحديث ملف Excel')}
function renderShifts(){const s=data.activeShift;document.getElementById('view').innerHTML=head('الورديات والتقفيل','تابع النقدية وأغلق الشفت مع تقرير فرق الخزينة',`<button class="btn ${s?'btn-danger':'btn-primary'}" onclick="${s?'closeShift()':'openShift()'}"><i data-lucide="${s?'lock-keyhole':'play'}"></i> ${s?'تقفيل الشفت':'فتح شفت جديد'}</button>`)+`<div class="grid metrics"><div class="metric"><div class="metric-top">الحالة</div><b>${s?'مفتوحة':'مغلقة'}</b><small>${s?new Date(s.openedAt).toLocaleString('ar-EG'):'لا توجد وردية حالية'}</small></div><div class="metric"><div class="metric-top">الرصيد الافتتاحي</div><b>${money(s?.opening||0)}</b></div><div class="metric"><div class="metric-top">مبيعات نقدية</div><b>${money(s?.cash||0)}</b></div><div class="metric"><div class="metric-top">المتوقع</div><b>${money(s?(s.opening+s.cash):0)}</b></div></div><div class="card"><h2>سجل الورديات السابقة</h2><div class="table-wrap"><table class="table"><thead><tr><th>الشفت</th><th>البداية</th><th>النهاية</th><th>المتوقع</th><th>الفعلي</th><th>الفرق</th></tr></thead><tbody>${data.shifts.slice().reverse().map(x=>`<tr><td>#${x.id}</td><td>${new Date(x.openedAt).toLocaleString('ar-EG')}</td><td>${new Date(x.closedAt).toLocaleString('ar-EG')}</td><td>${money(x.expected)}</td><td>${money(x.actual)}</td><td class="${x.difference<0?'danger-text':''}">${money(x.difference)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لم يتم تقفيل ورديات بعد</td></tr>'}</tbody></table></div></div>`}
function openShift(){if(data.activeShift){toast('هناك وردية مفتوحة بالفعل');return}showModal('فتح وردية جديدة',`<div class="field"><label>الرصيد الافتتاحي في الخزينة</label><input id="opening" class="input" type="number" value="0"></div><div class="modal-actions"><button class="btn btn-primary" onclick="confirmOpenShift()">بدء الوردية</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}function confirmOpenShift(){const opening=Number(document.getElementById('opening').value);if(opening<0){toast('أدخل رصيداً صحيحاً');return}data.activeShift={id:String(Date.now()).slice(-6),openedAt:new Date().toISOString(),opening,cash:0};save();closeModal();render();toast('تم فتح الوردية بنجاح')}function closeShift(){const s=data.activeShift;if(!s)return;showModal('تقفيل الشفت',`<p class="muted">النقد المتوقع في الخزينة: <strong>${money(s.opening+s.cash)}</strong></p><div class="field"><label>النقد الفعلي الموجود</label><input id="actual" class="input" type="number" value="${s.opening+s.cash}"></div><div class="modal-actions"><button class="btn btn-primary" onclick="confirmCloseShift()">حفظ التقفيل وتنزيل Excel</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}function confirmCloseShift(){const s=data.activeShift,actual=Number(document.getElementById('actual').value),expected=s.opening+s.cash;if(actual<0){toast('أدخل قيمة صحيحة');return}data.shifts.push({...s,closedAt:new Date().toISOString(),expected,actual,difference:actual-expected});data.activeShift=null;save();closeModal();downloadExcel('تم تقفيل الشفت وحفظ تقرير Excel');render()}
function renderReports(){const revenue=data.sales.reduce((a,x)=>a+x.total,0),days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return {d,total:data.sales.filter(s=>new Date(s.date).toDateString()===d.toDateString()).reduce((a,x)=>a+x.total,0)}}),max=Math.max(...days.map(x=>x.total),1);document.getElementById('view').innerHTML=head('التقارير','ملخص المبيعات والمخزون والتشغيل',`<button class="btn btn-primary" onclick="downloadExcel('تم تحديث Google Sheets وتنزيل Excel')"><i data-lucide="file-spreadsheet"></i> Excel</button><button class="btn btn-soft" onclick="printReport()"><i data-lucide="file-down"></i> PDF</button><button class="btn btn-soft" onclick="shareReportsWhatsApp()"><i data-lucide="message-circle"></i> واتساب</button>`)+`<div class="grid metrics"><div class="metric"><div class="metric-top">إجمالي المبيعات</div><b>${money(revenue)}</b></div><div class="metric"><div class="metric-top">الفواتير</div><b>${data.sales.length}</b></div><div class="metric"><div class="metric-top">قيمة المشتريات</div><b>${money(data.purchases.reduce((a,x)=>a+x.total,0))}</b></div><div class="metric"><div class="metric-top">مرتجعات</div><b>${money(data.returns.reduce((a,x)=>a+x.total,0))}</b></div></div><section class="card"><h2>المبيعات خلال آخر 7 أيام</h2><div class="chart">${days.map(x=>`<div class="bar-col"><span class="muted" style="font-size:10px">${x.total?money(x.total):''}</span><div class="bar" style="height:${Math.max(4,x.total/max*125)}px"></div><label>${x.d.toLocaleDateString('ar-EG',{weekday:'short'})}</label></div>`).join('')}</div></section>`}
function renderUsers(){if(!requirePermission('users')){current='dashboard';return renderDashboard()}document.getElementById('view').innerHTML=head('المستخدمون والصلاحيات','تحكم في حسابات فريق الصيدلية',`<button class="btn btn-primary" onclick="userModal()"><i data-lucide="user-plus"></i> إضافة مستخدم</button>`)+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>اسم الدخول</th><th>الدور</th><th>الصلاحيات</th><th>الحالة</th><th></th></tr></thead><tbody>${data.users.map((u,i)=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td><span class="status info">${esc(u.role)}</span></td><td>${u.role==='مدير'?'كل الصلاحيات':u.role==='صيدلي'?'المبيعات والمخزون والتوريد':'المبيعات فقط'}</td><td><span class="status ${u.active?'ok':'out'}">${u.active?'نشط':'موقوف'}</span></td><td><button class="btn btn-soft" style="padding:6px" onclick="toggleUser(${i})">${u.active?'إيقاف':'تفعيل'}</button> <button class="btn btn-danger" style="padding:6px" onclick="removeUser(${i})"><i data-lucide="trash-2"></i></button></td></tr>`).join('')}</tbody></table></div></div>`}
function userModal(){showModal('إضافة مستخدم',`<div class="form-grid"><div class="field"><label>الاسم</label><input id="uName" class="input"></div><div class="field"><label>اسم المستخدم</label><input id="uLogin" class="input"></div><div class="field"><label>كلمة المرور</label><input id="uPass" class="input" type="password"></div><div class="field"><label>الدور</label><select id="uRole" class="input"><option>صيدلي</option><option>كاشير</option><option>مدير</option></select></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="saveUser()">حفظ المستخدم</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}function saveUser(){if(!requirePermission('users'))return;const user={id:Date.now(),name:uName.value.trim(),username:uLogin.value.trim(),password:uPass.value,role:uRole.value,active:true};if(!user.name||!user.username||!user.password){toast('أكمل بيانات المستخدم');return}if(data.users.some(x=>x.username===user.username)){toast('اسم المستخدم موجود بالفعل');return}data.users.push(user);save();closeModal();renderUsers();downloadExcel('تمت إضافة المستخدم وتحديث ملف Excel')}function toggleUser(i){if(!requirePermission('users'))return;data.users[i].active=!data.users[i].active;save();renderUsers()}function removeUser(i){if(!requirePermission('users')||data.users[i].username==='admin')return;data.users.splice(i,1);save();renderUsers()}
function renderSettings(){document.getElementById('view').innerHTML=head('الإعدادات','ربط Google Sheets والنسخ الاحتياطي والصلاحيات')+`<div class="grid dashboard-grid"><section class="card"><h2>Google Sheets</h2><p class="muted">الصق رابط Web App من Google Apps Script مرة واحدة، وسيتم إرسال كل البيانات إليه تلقائياً بعد البيع والتوريد وتقفيل الشفت.</p><div class="field"><label>رابط Google Apps Script Web App</label><input id="sheetUrl" class="input" value="${esc(data.googleSheetUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="actions"><button class="btn btn-primary" onclick="saveSheetUrl()"><i data-lucide="link"></i> حفظ وربط Google Sheets</button><button class="btn btn-soft" onclick="syncGoogleSheet().then(ok=>toast(ok?'تمت المزامنة':'تعذر الاتصال'))"><i data-lucide="refresh-cw"></i> مزامنة الآن</button></div><p class="hint" style="text-align:right">الحالة: <span style="color:${googleSyncState==='متصل'?'var(--green)':'var(--muted)'}">${googleSyncState}</span></p></section><section class="card"><h2>بيانات الدخول</h2><div class="list"><div class="list-item"><span>المستخدم الحالي</span><b>${esc(data.user)} · ${esc(data.role)}</b></div><div class="list-item"><span>آخر حفظ</span><b>${document.getElementById('lastSave').textContent}</b></div><div class="list-item"><span>الإصدار</span><b>2026.3</b></div></div><button class="btn btn-soft" style="margin-top:16px" onclick="backupJson()"><i data-lucide="archive"></i> نسخة JSON احتياطية</button></section></div>`}function saveSheetUrl(){const url=document.getElementById('sheetUrl').value.trim();if(!/^https:\/\//i.test(url)){toast('أدخل رابط HTTPS صحيح');return}data.googleSheetUrl=url;save();syncGoogleSheet().then(ok=>{renderSettings();toast(ok?'تم ربط Google Sheets والحفظ التلقائي يعمل الآن':'تم حفظ الرابط لكن تعذر الاتصال')})}function backupJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='صيدليتي-نسخة-احتياطية.json';a.click();toast('تم تنزيل النسخة الاحتياطية')}
function updateShift(){const b=document.getElementById('shiftButton');if(!b)return;b.className='shift-pill '+(data.activeShift?'':'closed');b.innerHTML=`<i data-lucide="${data.activeShift?'unlock-keyhole':'lock-keyhole'}"></i><span>${data.activeShift?'وردية مفتوحة · '+money(data.activeShift.opening+data.activeShift.cash):'لا توجد وردية مفتوحة'}</span>`;icon()}
function showModal(title,body){document.getElementById('modalContent').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()"><i data-lucide="x"></i></button></div>${body}`;document.getElementById('modal').classList.add('open');icon()}function closeModal(){document.getElementById('modal').classList.remove('open')}

function logout(){if(data.activeShift&&!confirm('هناك وردية مفتوحة. هل تريد تسجيل الخروج؟'))return;data.cart=[];data.activated=false;save();document.getElementById('app').classList.add('hidden');document.getElementById('gate').classList.remove('hidden');document.getElementById('password').value='';document.getElementById('license').value='';toast('تم تسجيل الخروج')}
function prepareRetailData(){data.products.forEach((p,index)=>{p.packPrice=Number.isFinite(Number(p.packPrice))?Number(p.packPrice):Number(p.price)||0;p.stripsPerPack=Math.max(1,Number(p.stripsPerPack)||1);p.tabletsPerStrip=Math.max(1,Number(p.tabletsPerStrip)||1);p.stripPrice=Number.isFinite(Number(p.stripPrice))?Number(p.stripPrice):(p.stripsPerPack>1?Math.ceil(p.packPrice/p.stripsPerPack):p.packPrice);p.tabletPrice=Number.isFinite(Number(p.tabletPrice))?Number(p.tabletPrice):(p.tabletsPerStrip>1?Math.ceil(p.stripPrice/p.tabletsPerStrip):p.stripPrice);p.stockBase=Number.isFinite(Number(p.stockBase))?Number(p.stockBase):(Number(p.stock)||0)*p.stripsPerPack*p.tabletsPerStrip;p.barcode=p.barcode||'622'+String(p.id||index+1).replace(/\D/g,'').padStart(9,'0').slice(-9);p.price=p.packPrice})}
function retailOptions(p){const options=[{key:'pack',label:'علبة',price:p.packPrice,base:p.stripsPerPack*p.tabletsPerStrip}];if(p.stripsPerPack>1)options.push({key:'strip',label:'شريط',price:p.stripPrice,base:p.tabletsPerStrip});if(p.tabletsPerStrip>1)options.push({key:'tablet',label:'قرص',price:p.tabletPrice,base:1});return options}
function retailAvailability(p){const packBase=p.stripsPerPack*p.tabletsPerStrip, packs=Math.floor(p.stockBase/packBase), remainder=p.stockBase%packBase, strips=Math.floor(remainder/p.tabletsPerStrip), tablets=remainder%p.tabletsPerStrip;return `${packs} علبة${strips?` · ${strips} شريط`:''}${tablets?` · ${tablets} قرص`:''}`}
function productCards(list){return list.map(p=>{const opts=retailOptions(p);return `<div class="product retail-card"><div class="product-main"><span class="product-tag">${esc(p.category)}</span><b>${esc(p.name)}</b><small class="pack-hint">${p.stripsPerPack>1?`${p.stripsPerPack} شرائط · ${p.tabletsPerStrip} قرص/شريط`:'وحدة بيع واحدة'} · كود ${esc(p.barcode)}</small><div class="retail-prices">${opts.map(o=>`<span>${o.label}: ${money(o.price)}</span>`).join('')}</div></div><select class="retail-select" id="retail-${p.id}">${opts.map(o=>`<option value="${o.key}">${o.label} · ${money(o.price)}</option>`).join('')}</select><button class="retail-add" onclick="addRetailCart(${p.id})" ${p.stockBase<1?'disabled':''}>إضافة للفاتورة · متاح ${retailAvailability(p)}</button></div>`}).join('')||'<div class="empty">لا توجد أصناف</div>'}
function addRetailCart(id){const p=data.products.find(x=>x.id===id),choice=document.getElementById('retail-'+id)?.value,option=retailOptions(p).find(x=>x.key===choice)||retailOptions(p)[0];if(!p||p.stockBase<option.base){toast('الكمية المطلوبة غير متاحة');return}const line=data.cart.find(x=>x.id===id&&x.sellUnit===option.key);const used=data.cart.filter(x=>x.id===id).reduce((sum,x)=>sum+x.baseQty,0);if(used+option.base>p.stockBase){toast('المخزون لا يكفي لهذه الوحدة');return}if(line)line.qty++;else data.cart.push({id:p.id,name:p.name,unit:option.label,sellUnit:option.key,price:option.price,baseQty:option.base,qty:1});save();renderSales()}
function cartLines(){return data.cart.length?data.cart.map((x,i)=>`<div class="cart-row"><span>${esc(x.name)}<small class="muted"><br>${x.qty} ${esc(x.unit)} × ${money(x.price)}</small></span><span class="qty"><button onclick="changeCart(${i},-1)">−</button>${x.qty}<button onclick="changeCart(${i},1)">+</button></span><span class="cart-unit">${esc(x.unit)}</span><button class="btn btn-danger" style="padding:5px" onclick="removeCart(${i})"><i data-lucide="trash-2"></i></button></div>`).join(''):'<div class="empty">السلة فارغة<br><small>اختر علبة أو شريطاً أو قرصاً</small></div>'}
function addProductModal(){showModal('إضافة دواء بتعبئة التجزئة',`<div class="form-grid"><div class="field"><label>اسم الدواء</label><input id="pName" class="input" placeholder="مثال: بنادول"></div><div class="field"><label>التصنيف</label><input id="pCat" class="input" placeholder="مسكنات"></div><div class="field"><label>سعر العلبة</label><input id="pPrice" class="input" type="number" min="0" step="0.01" placeholder="100"></div><div class="field"><label>عدد الشرائط داخل العلبة</label><input id="pStrips" class="input" type="number" min="1" value="3"></div><div class="field"><label>سعر الشريط</label><input id="pStripPrice" class="input" type="number" min="0" step="0.01" placeholder="33"></div><div class="field"><label>عدد الأقراص داخل الشريط</label><input id="pTablets" class="input" type="number" min="1" value="10"></div><div class="field"><label>سعر القرص</label><input id="pTabletPrice" class="input" type="number" min="0" step="0.01" placeholder="3"></div><div class="field"><label>عدد العلب بالمخزون</label><input id="pStock" class="input" type="number" min="0" value="0"></div><div class="field"><label>حد التنبيه بالعلب</label><input id="pMin" class="input" type="number" min="0" value="5"></div><div class="field"><label>تاريخ الصلاحية</label><input id="pExpiry" class="input" type="date"></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="saveProduct()">حفظ الدواء</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}
function saveProduct(){if(!requirePermission('inventory'))return;const packPrice=Number(pPrice.value),strips=Math.max(1,Number(pStrips.value)||1),stripPrice=Number(pStripPrice.value),tablets=Math.max(1,Number(pTablets.value)||1),tabletPrice=Number(pTabletPrice.value),stock=Number(pStock.value),min=Number(pMin.value);if(!pName.value.trim()||[packPrice,stripPrice,tabletPrice,stock,min].some(x=>!Number.isFinite(x)||x<0)){toast('أكمل بيانات التعبئة والأسعار بصورة صحيحة');return}const p={id:Date.now(),name:pName.value.trim(),category:pCat.value.trim()||'عام',unit:'علبة',packPrice,stripsPerPack:strips,stripPrice,tabletsPerStrip:tablets,tabletPrice,price:packPrice,stock,min,stockBase:stock*strips*tablets,expiry:pExpiry.value||'غير محدد'};data.products.push(p);save();closeModal();renderInventory();downloadExcel('تمت إضافة الدواء بتعبئة التجزئة')}
function inventoryTable(list){return `<table class="table"><thead><tr><th>الدواء</th><th>تعبئة العلبة</th><th>أسعار التجزئة</th><th>المتاح</th><th>الصلاحية</th><th>الحالة</th><th></th></tr></thead><tbody>${list.map(p=>{const packs=Math.floor(p.stockBase/(p.stripsPerPack*p.tabletsPerStrip));return `<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.category)}</small></td><td>${p.stripsPerPack} شريط / ${p.tabletsPerStrip} قرص</td><td>علبة ${money(p.packPrice)}<br>شريط ${money(p.stripPrice)}<br>قرص ${money(p.tabletPrice)}</td><td>${retailAvailability(p)}<br><small class="muted">${p.stockBase} قرص أساسي</small> <button class="btn btn-soft" style="padding:4px 7px" onclick="adjustStock(${p.id})">مخزون</button></td><td>${esc(p.expiry)}</td><td><span class="status ${p.stockBase<1?'out':packs<=p.min?'low':'ok'}">${p.stockBase<1?'نفد':packs<=p.min?'منخفض':'متوفر'}</span></td><td><button class="btn btn-soft" style="padding:6px" onclick="editRetailData(${p.id})">تعبئة</button> <button class="btn btn-danger" style="padding:6px" onclick="deleteProduct(${p.id})"><i data-lucide="trash-2"></i></button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">لا توجد أدوية</td></tr>'}</tbody></table>`}
function changeCart(i,n){const line=data.cart[i],p=data.products.find(x=>x.id===line.id);if(n>0){const used=data.cart.filter(x=>x.id===line.id).reduce((sum,x)=>sum+x.baseQty*x.qty,0);if(used+line.baseQty>p.stockBase){toast('لا توجد كمية كافية في المخزون');return}}line.qty+=n;if(line.qty<1)data.cart.splice(i,1);save();renderSales()}
function saveSale(){if(!requirePermission('sales'))return;const total=data.cart.reduce((a,x)=>a+x.price*x.qty,0),payment=document.getElementById('payment').value;if(!data.activeShift){toast('افتح وردية قبل تسجيل المبيعات');closeModal();return}data.cart.forEach(x=>{const p=data.products.find(p=>p.id===x.id);p.stockBase=Math.max(0,p.stockBase-x.baseQty*x.qty);p.stock=Math.floor(p.stockBase/(p.stripsPerPack*p.tabletsPerStrip))});data.sales.push({id:String(Date.now()).slice(-7),date:new Date().toISOString(),total,payment,items:data.cart.map(x=>({...x}))});if(payment==='cash')data.activeShift.cash+=total;data.cart=[];save();closeModal();downloadExcel('تم حفظ البيع وتحديث مخزون التجزئة');renderSales()}
function adjustStock(id){const p=data.products.find(x=>x.id===id),v=prompt('عدد العلب الجديدة لـ '+p.name,Math.floor(p.stockBase/(p.stripsPerPack*p.tabletsPerStrip)));if(v===null)return;const packs=Math.max(0,Number(v)||0);p.stock=packs;p.stockBase=packs*p.stripsPerPack*p.tabletsPerStrip;save();renderInventory();downloadExcel('تم تحديث مخزون التجزئة')}
function editRetailData(id){const p=data.products.find(x=>x.id===id);showModal('تعديل تعبئة وأسعار '+esc(p.name),`<div class="form-grid"><div class="field"><label>سعر العلبة</label><input id="ePack" class="input" type="number" value="${p.packPrice}"></div><div class="field"><label>عدد الشرائط</label><input id="eStrips" class="input" type="number" value="${p.stripsPerPack}"></div><div class="field"><label>سعر الشريط</label><input id="eStripPrice" class="input" type="number" value="${p.stripPrice}"></div><div class="field"><label>أقراص الشريط</label><input id="eTablets" class="input" type="number" value="${p.tabletsPerStrip}"></div><div class="field"><label>سعر القرص</label><input id="eTabletPrice" class="input" type="number" value="${p.tabletPrice}"></div></div><p class="hint" style="text-align:right">مثال: علبة 100 ج.م · 3 شرائط · 30 قرصاً للشريط · الشريط 33 ج.م · القرص 3 ج.م</p><div class="modal-actions"><button class="btn btn-primary" onclick="saveRetailData(${id})">حفظ التعبئة</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}
function saveRetailData(id){const p=data.products.find(x=>x.id===id),oldBase=p.stripsPerPack*p.tabletsPerStrip,oldPacks=Math.floor(p.stockBase/oldBase),strips=Math.max(1,Number(eStrips.value)||1),tablets=Math.max(1,Number(eTablets.value)||1);p.packPrice=Number(ePack.value);p.stripsPerPack=strips;p.stripPrice=Number(eStripPrice.value);p.tabletsPerStrip=tablets;p.tabletPrice=Number(eTabletPrice.value);p.price=p.packPrice;p.stock=oldPacks;p.stockBase=oldPacks*strips*tablets;if([p.packPrice,p.stripPrice,p.tabletPrice].some(x=>!Number.isFinite(x)||x<0)){toast('أدخل أسعاراً صحيحة');return}save();closeModal();renderInventory();downloadExcel('تم تحديث تعبئة الدواء')}
function renderSupplierRows(){return data.suppliers.map((s,i)=>{const balance=data.supplierTransactions.filter(t=>t.supplierId===s.id).reduce((sum,t)=>sum+(t.kind==='purchase'?t.amount:-t.amount),0);return `<tr><td><b>${esc(s.name)}</b></td><td><span class="status info">${esc(s.code)}</span></td><td>${esc(s.phone||'-')}</td><td class="${balance>0?'danger-text':''}">${money(balance)}</td><td><button class="btn btn-soft" style="padding:6px" onclick="supplierStatement(${s.id})">كشف الحساب</button> <button class="btn btn-danger" style="padding:6px" onclick="deleteSupplier(${s.id})"><i data-lucide="trash-2"></i></button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">لا يوجد موردون مسجلون</td></tr>'}
function renderSuppliers(){if(!requirePermission('inventory'))return;document.getElementById('view').innerHTML=head('الموردون','إدارة بيانات الموردين وأكوادهم وأرصدة الحسابات',`<button class="btn btn-primary" onclick="supplierModal()"><i data-lucide="plus"></i> إضافة مورد</button>`)+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>المورد</th><th>الكود</th><th>الهاتف</th><th>الرصيد المستحق</th><th>إجراءات</th></tr></thead><tbody>${renderSupplierRows()}</tbody></table></div></div>`}
function supplierModal(){showModal('إضافة مورد',`<div class="form-grid"><div class="field"><label>اسم المورد</label><input id="sName" class="input"></div><div class="field"><label>كود المورد</label><input id="sCode" class="input" placeholder="SUP-001"></div><div class="field"><label>الهاتف</label><input id="sPhone" class="input"></div><div class="field"><label>العنوان</label><input id="sAddress" class="input"></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="saveSupplier()">حفظ المورد</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}
function saveSupplier(){if(!requirePermission('inventory'))return;const supplier={id:Date.now(),name:sName.value.trim(),code:sCode.value.trim()||'SUP-'+String(Date.now()).slice(-5),phone:sPhone.value.trim(),address:sAddress.value.trim()};if(!supplier.name){toast('أدخل اسم المورد');return}if(data.suppliers.some(s=>s.code===supplier.code)){toast('كود المورد موجود بالفعل');return}data.suppliers.push(supplier);save();closeModal();renderSuppliers();downloadExcel('تم حفظ المورد')}
function deleteSupplier(id){if(data.purchases.some(p=>p.supplierId===id)){toast('لا يمكن حذف مورد له مشتريات');return}data.suppliers=data.suppliers.filter(s=>s.id!==id);save();renderSuppliers()}
function supplierStatement(id){const s=data.suppliers.find(x=>x.id===id);const rows=data.supplierTransactions.filter(t=>t.supplierId===id);showModal('كشف حساب '+esc(s.name),`<div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>القيمة</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${new Date(t.date).toLocaleString('ar-EG')}</td><td>${t.kind==='purchase'?'مشتريات':t.kind==='payment'?'سند صرف':'تسوية'}</td><td>${esc(t.note||'')}</td><td>${money(t.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد حركات</td></tr>'}</tbody></table></div><div class="modal-actions"><button class="btn btn-soft" onclick="closeModal()">إغلاق</button></div>`)}
function renderAccounts(){if(!requirePermission('inventory'))return;const balances=data.suppliers.map(s=>{const balance=data.supplierTransactions.filter(t=>t.supplierId===s.id).reduce((sum,t)=>sum+(t.kind==='purchase'?t.amount:-t.amount),0);return {...s,balance}});document.getElementById('view').innerHTML=head('حسابات الموردين','سندات قبض وصرف وتسويات الموردين',`<button class="btn btn-primary" onclick="supplierVoucher('payment')"><i data-lucide="arrow-up-left"></i> سند صرف</button><button class="btn btn-soft" onclick="supplierVoucher('receipt')"><i data-lucide="arrow-down-right"></i> سند قبض</button>`)+`<div class="grid metrics">${balances.slice(0,4).map(s=>`<div class="metric"><div class="metric-top">${esc(s.name)}</div><b class="${s.balance>0?'danger-text':''}">${money(s.balance)}</b><small>${s.balance>0?'مستحق للمورد':'لا يوجد مستحق'}</small></div>`).join('')||'<div class="card empty">أضف مورداً أولاً</div>'}</div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>المورد</th><th>الكود</th><th>الرصيد المستحق</th><th>حركة</th></tr></thead><tbody>${balances.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.code)}</td><td class="${s.balance>0?'danger-text':''}">${money(s.balance)}</td><td><button class="btn btn-soft" style="padding:6px" onclick="supplierStatement(${s.id})">كشف الحساب</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد بيانات</td></tr>'}</tbody></table></div></div>`}
function supplierVoucher(kind){if(!data.suppliers.length){toast('أضف مورداً أولاً');return}showModal(kind==='payment'?'سند صرف للمورد':'سند قبض من المورد',`<div class="field"><label>المورد</label><select id="vSupplier" class="input">${data.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.code)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>القيمة</label><input id="vAmount" class="input" type="number" min="0" step="0.01"></div><div class="field"><label>البيان</label><input id="vNote" class="input" placeholder="سداد دفعة / مرتجع / تسوية"></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="saveVoucher('${kind}')">حفظ السند</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}
function saveVoucher(kind){const amount=Number(vAmount.value);if(!Number.isFinite(amount)||amount<=0){toast('أدخل قيمة صحيحة');return}data.supplierTransactions.push({id:Date.now(),supplierId:Number(vSupplier.value),kind:kind==='payment'?'payment':'receipt',amount,note:vNote.value.trim(),date:new Date().toISOString()});save();closeModal();renderAccounts();downloadExcel('تم حفظ السند وتحديث حساب المورد')}
function renderPurchases(){document.getElementById('view').innerHTML=head('المشتريات والتوريد','سجّل التوريد على مورد ليظهر فوراً في حسابه',`<button class="btn btn-primary" onclick="purchaseModal()"><i data-lucide="plus"></i> تسجيل توريد</button>`)+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>رقم الحركة</th><th>التاريخ</th><th>المورد</th><th>الأصناف</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th></tr></thead><tbody>${data.purchases.slice(-12).reverse().map(x=>`<tr><td>#${x.id}</td><td>${new Date(x.date).toLocaleString('ar-EG')}</td><td>${esc(x.supplierName||'غير محدد')}</td><td>${x.lines.length}</td><td>${money(x.total)}</td><td>${money(x.paid||0)}</td><td class="${x.total-(x.paid||0)>0?'danger-text':''}">${money(x.total-(x.paid||0))}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد حركات توريد</td></tr>'}</tbody></table></div></div>`}
function purchaseModal(){showModal('تسجيل توريد',`<div class="field"><label>المورد</label><select id="buySupplier" class="input"><option value="">مورد غير محدد</option>${data.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.code)}</option>`).join('')}</select></div><div class="field"><label>الدواء / الصنف</label><select id="buyProduct" class="input">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>عدد العلب / الوحدات</label><input id="buyQty" class="input" type="number" min="1" value="1"></div><div class="field"><label>تكلفة الوحدة</label><input id="buyPrice" class="input" type="number" min="0" value="0"></div><div class="field"><label>المدفوع الآن</label><input id="buyPaid" class="input" type="number" min="0" value="0"></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="savePurchase()">حفظ التوريد والحساب</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)}
function savePurchase(){const p=data.products.find(x=>x.id==buyProduct.value),supplier=data.suppliers.find(x=>x.id==Number(buySupplier.value)),qty=Number(buyQty.value),price=Number(buyPrice.value),paid=Number(buyPaid.value)||0,total=qty*price;if(!p||qty<=0||price<0||paid<0||paid>total){toast('تحقق من بيانات التوريد والمدفوع');return}p.stockBase+=(p.stripsPerPack||1)*(p.tabletsPerStrip||1)*qty;p.stock=Math.floor(p.stockBase/((p.stripsPerPack||1)*(p.tabletsPerStrip||1)));const purchase={id:String(Date.now()).slice(-7),date:new Date().toISOString(),supplierId:supplier?.id||null,supplierName:supplier?.name||'غير محدد',lines:[{name:p.name,qty}],total,paid};data.purchases.push(purchase);if(supplier){data.supplierTransactions.push({id:Date.now()+1,supplierId:supplier.id,kind:'purchase',amount:total,note:'فاتورة توريد #'+purchase.id,date:purchase.date});if(paid)data.supplierTransactions.push({id:Date.now()+2,supplierId:supplier.id,kind:'payment',amount:paid,note:'مدفوع مع فاتورة التوريد #'+purchase.id,date:purchase.date})}save();closeModal();renderPurchases();downloadExcel('تم تسجيل التوريد وتحديث حساب المورد')}
function addProductModal(){showModal('إضافة صنف جديد',`<div class="form-grid"><div class="field"><label>اسم الصنف</label><input id="pName" class="input" placeholder="بنادول / شراب / كريم"></div><div class="field"><label>نوع الصنف</label><select id="pType" class="input" onchange="toggleProductType()"><option value="دواء">دواء بأقراص</option><option value="شراب">شراب</option><option value="كريمات">كريمات</option><option value="مستلزمات">مستلزمات</option></select></div><div class="field"><label>التصنيف</label><input id="pCat" class="input" placeholder="مسكنات"></div><div class="field"><label>سعر البيع</label><input id="pPrice" class="input" type="number" min="0" step="0.01" placeholder="100"></div><div id="retailFields"><div class="field"><label>عدد الشرائط داخل العلبة</label><input id="pStrips" class="input" type="number" min="1" value="3"></div><div class="field"><label>عدد الأقراص داخل الشريط</label><input id="pTablets" class="input" type="number" min="1" value="10"></div></div><div class="field"><label>الكمية بالمخزون</label><input id="pStock" class="input" type="number" min="0" value="0"></div><div class="field"><label>حد التنبيه</label><input id="pMin" class="input" type="number" min="0" value="5"></div><div class="field"><label>تاريخ الصلاحية</label><input id="pExpiry" class="input" type="date"></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="saveProduct()">حفظ الصنف</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`);setTimeout(toggleProductType,0)}
function toggleProductType(){const medicine=document.getElementById('pType')?.value==='دواء';const fields=document.getElementById('retailFields');if(fields)fields.style.display=medicine?'block':'none'}
function saveProduct(){if(!requirePermission('inventory'))return;const type=document.getElementById('pType').value,packPrice=Number(pPrice.value),strips=type==='دواء'?Math.max(1,Number(pStrips.value)||1):1,tablets=type==='دواء'?Math.max(1,Number(pTablets.value)||1):1,stock=Number(pStock.value),min=Number(pMin.value);if(!pName.value.trim()||[packPrice,stock,min].some(x=>!Number.isFinite(x)||x<0)){toast('أكمل بيانات الصنف بصورة صحيحة');return}const id=Date.now(),p={id,barcode:'622'+String(id).slice(-9),name:pName.value.trim(),category:pCat.value.trim()||type,type,unit:type==='دواء'?'علبة':type==='شراب'?'زجاجة':type==='كريمات'?'عبوة':'قطعة',packPrice,stripPrice:type==='دواء'?Math.ceil(packPrice/strips):packPrice,tabletPrice:type==='دواء'?Math.ceil(packPrice/(strips*tablets)):packPrice,stripsPerPack:strips,tabletsPerStrip:tablets,price:packPrice,stock,min,stockBase:stock*strips*tablets,expiry:pExpiry.value||'غير محدد'};data.products.push(p);save();closeModal();renderInventory();downloadExcel('تمت إضافة الصنف')}
function audit(action,details){data.auditLog.push({id:Date.now(),date:new Date().toISOString(),user:data.user,action,details});if(data.auditLog.length>500)data.auditLog.shift()}
function returnableItems(sale){return (sale.items||[]).map((item,index)=>{const returned=data.returns.filter(r=>r.saleId===sale.id&&r.itemIndex===index).reduce((sum,r)=>sum+r.qty,0);return {...item,index,remaining:Math.max(0,item.qty-returned)}}).filter(x=>x.remaining>0)}

function renderStocktake(){document.getElementById('view').innerHTML=head('الجرد والتسويات','قارن الكمية الفعلية بالمخزون وسجل الفروقات',`<button class="btn btn-primary" onclick="saveStocktake()"><i data-lucide="save"></i> حفظ الجرد</button>`)+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>الصنف</th><th>المسجل</th><th>الفعلي</th><th>الفرق</th></tr></thead><tbody>${data.products.map(p=>{const recorded=p.stockBase||0;return `<tr><td>${esc(p.name)}</td><td>${recorded}</td><td><input class="stock-count input" data-id="${p.id}" value="${recorded}" type="number" min="0" style="width:110px"></td><td id="diff-${p.id}">0</td></tr>`}).join('')}</tbody></table></div></div>`}function saveStocktake(){const rows=[...document.querySelectorAll('.stock-count')];rows.forEach(input=>{const p=data.products.find(x=>x.id===Number(input.dataset.id)),actual=Math.max(0,Number(input.value)||0),before=p.stockBase||0;if(actual!==before){data.stockAdjustments.push({id:Date.now(),productId:p.id,product:p.name,before,actual,difference:actual-before,date:new Date().toISOString()});p.stockBase=actual;p.stock=Math.floor(actual/((p.stripsPerPack||1)*(p.tabletsPerStrip||1)))}});audit('جرد وتسوية','تم حفظ الجرد');save();renderStocktake();downloadExcel('تم حفظ الجرد والتسويات')}

const canManageUsers=()=>data.role==='مدير'||(window.hasPermission&&hasPermission('users'));
function ensurePermissions(user){if(user.role==='مدير')user.permissions=[...permissionKeys];else if(!Array.isArray(user.permissions))user.permissions=[];return user}
window.editUserPermissions=function(index){if(!window.hasPermission||!hasPermission('users')){toast('لا توجد صلاحية لإدارة المستخدمين');return}const user=ensurePermissions(data.users[index]);const fields=permissionKeys.map(key=>`<label class="permission-item"><input type="checkbox" class="direct-permission" value="${key}" ${user.permissions.includes(key)?'checked':''}><span>${permissionLabels[key]}</span></label>`).join('');showModal('تحديد صلاحيات: '+esc(user.name),`<p class="permission-note">حدد بالعلامة كل شاشة وكل عملية مسموحة لهذا المستخدم. إزالة العلامة تخفيها وتمنع تنفيذها.</p><div class="permission-grid">${fields}</div><div class="modal-actions"><button class="btn btn-primary" onclick="saveDirectPermissions(${index})">حفظ الصلاحيات</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)};
window.saveDirectPermissions=function(index){if(!window.hasPermission||!hasPermission('users'))return;const user=data.users[index];if(user.role==='مدير'){user.permissions=[...permissionKeys]}else{user.permissions=[...document.querySelectorAll('.direct-permission:checked')].map(input=>input.value)}save();closeModal();render();toast('تم حفظ صلاحيات '+user.name)};
const originalUsersRender=renderUsers;renderUsers=function(){if(!window.hasPermission||!hasPermission('users')){current='dashboard';return renderDashboard()}document.getElementById('view').innerHTML=head('المستخدمون والصلاحيات','حدد بنفسك الشاشات والعمليات المسموحة لكل مستخدم',`<button class="btn btn-primary" onclick="userModal()"><i data-lucide="user-plus"></i> مستخدم جديد</button>`)+`<div class="card permissions-card"><div class="table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>الدور</th><th>الصلاحيات المفعلة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${data.users.map((user,index)=>{ensurePermissions(user);const count=user.permissions.length;return `<tr><td><b>${esc(user.name)}</b><br><small class="muted">${esc(user.username)}</small></td><td><span class="status info">${esc(user.role)}</span></td><td>${user.role==='مدير'?'كل الصلاحيات':count+' صلاحية'}</td><td><span class="status ${user.active?'ok':'out'}">${user.active?'نشط':'موقوف'}</span></td><td><button class="btn btn-primary" onclick="editUserPermissions(${index})">تحديد الصلاحيات</button> <button class="btn btn-soft" onclick="toggleUser(${index})">${user.active?'إيقاف':'تفعيل'}</button></td></tr>`}).join('')}</tbody></table></div></div>`;icon()};
window.directUsersRenderer=renderUsers;
window.directEditUserPermissions=window.editUserPermissions;
window.directSaveUserPermissions=window.saveDirectPermissions;
function supplierLookup(){const supplier=supplierByCode(document.getElementById('buySupplierCode')?.value);const name=document.getElementById('buySupplierName');if(name)name.value=supplier?supplier.name:'كود غير مسجل'}
purchaseModal=function(){showModal('تسجيل توريد',`<div class="form-grid"><div class="field"><label>كود المورد</label><input id="buySupplierCode" class="input" placeholder="SUP-001" oninput="supplierLookup()"></div><div class="field"><label>اسم المورد</label><input id="buySupplierName" class="input" readonly value="كود غير مسجل"></div></div><div class="field"><label>الدواء / الصنف</label><select id="buyProduct" class="input">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>رقم فاتورة المورد</label><input id="buyInvoiceNo" class="input" placeholder="رقم الفاتورة"></div><div class="field"><label>عدد العلب / الوحدات</label><input id="buyQty" class="input" type="number" min="1" value="1"></div><div class="field"><label>تكلفة الوحدة</label><input id="buyPrice" class="input" type="number" min="0" value="0"></div><div class="field"><label>المدفوع الآن</label><input id="buyPaid" class="input" type="number" min="0" value="0"></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="savePurchase()">حفظ التوريد والحساب</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)};
savePurchase=function(){const supplier=supplierByCode(document.getElementById('buySupplierCode')?.value),p=data.products.find(x=>x.id==document.getElementById('buyProduct')?.value),qty=Number(document.getElementById('buyQty')?.value),price=Number(document.getElementById('buyPrice')?.value),paid=Number(document.getElementById('buyPaid')?.value)||0,invoiceNo=document.getElementById('buyInvoiceNo')?.value.trim(),total=qty*price;if(!supplier){toast('أدخل كود مورد صحيحاً أو أضف المورد أولاً');return}if(!invoiceNo){toast('أدخل رقم فاتورة المورد');return}if(!p||qty<=0||price<0||paid<0||paid>total){toast('تحقق من بيانات التوريد والمدفوع');return}const date=new Date().toISOString(),id=String(Date.now()).slice(-7);p.stockBase+=(p.stripsPerPack||1)*(p.tabletsPerStrip||1)*qty;p.stock=Math.floor(p.stockBase/((p.stripsPerPack||1)*(p.tabletsPerStrip||1)));data.purchases.push({id,date,invoiceNo,supplierId:supplier.id,supplierCode:supplier.code,supplierName:supplier.name,lines:[{name:p.name,qty}],total,paid});data.supplierTransactions.push({id:Date.now()+1,supplierId:supplier.id,kind:'purchase',amount:total,note:'فاتورة مورد '+invoiceNo,date,invoiceNo});if(paid)data.supplierTransactions.push({id:Date.now()+2,supplierId:supplier.id,kind:'payment',amount:paid,note:'مدفوع لفاتورة '+invoiceNo,date,invoiceNo});save();closeModal();renderPurchases();downloadExcel('تم تسجيل التوريد وتحديث حساب المورد')};
renderPurchases=function(){document.getElementById('view').innerHTML=head('المشتريات والتوريد','ابحث بكود المورد وسجل رقم فاتورة المورد',`<button class="btn btn-primary" onclick="purchaseModal()"><i data-lucide="plus"></i> تسجيل توريد</button>`)+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>رقم الحركة</th><th>فاتورة المورد</th><th>التاريخ</th><th>كود المورد</th><th>المورد</th><th>الأصناف</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th></tr></thead><tbody>${data.purchases.slice(-20).reverse().map(x=>`<tr><td>#${x.id}</td><td>${esc(x.invoiceNo||'-')}</td><td>${new Date(x.date).toLocaleString('ar-EG')}</td><td>${esc(x.supplierCode||'-')}</td><td>${esc(x.supplierName||x.supplier||'غير محدد')}</td><td>${(x.lines||[]).length}</td><td>${money(x.total)}</td><td>${money(x.paid||0)}</td><td class="${x.total-(x.paid||0)>0?'danger-text':''}">${money(x.total-(x.paid||0))}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">لا توجد حركات توريد</td></tr>'}</tbody></table></div></div>`};
const basicPermissionKeys=['dashboard','sales','inventory','purchases','suppliers','accounts','returns','expenses','customers','stocktake','shifts','reports','users','settings','activity'];
const sensitivePermissionKeys=['sale_complete','pdf','excel','print','shift_close','whatsapp'];
function permissionChecks(keys,user){return keys.map(key=>`<label class="permission-item"><input type="checkbox" class="account-permission" value="${key}" ${user.permissions.includes(key)?'checked':''} ${user.role==='مدير'?'disabled':''}><span>${permissionLabels[key]}</span></label>`).join('')}
window.editUserAccount=function(index){if(!canManageUsers()){toast('لا توجد صلاحية لإدارة المستخدمين');return}const user=ensurePermissions(data.users[index]);showModal('تعديل المستخدم: '+esc(user.name),`<div class="field"><label>كلمة السر الجديدة (اتركها فارغة للإبقاء على الحالية)</label><input id="editUserPassword" class="input" type="password" autocomplete="new-password"></div><div class="permission-group"><h3>العمليات الأساسية</h3><div class="permission-grid">${permissionChecks(basicPermissionKeys,user)}</div></div><div class="permission-group"><h3>العمليات الحساسة</h3><div class="permission-grid">${permissionChecks(sensitivePermissionKeys,user)}</div></div><div class="modal-actions"><button class="btn btn-primary" onclick="saveUserAccount(${index})">حفظ التعديلات</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)};
window.saveUserAccount=function(index){if(!canManageUsers())return;const user=data.users[index],newPassword=document.getElementById('editUserPassword')?.value||'';if(newPassword)user.password=newPassword;if(user.role==='مدير')user.permissions=[...permissionKeys];else user.permissions=[...document.querySelectorAll('.account-permission:checked')].map(input=>input.value);save();closeModal();render();toast('تم تعديل المستخدم والصلاحيات')};
renderUsers=function(){if(!canManageUsers()){current='dashboard';return renderDashboard()}document.getElementById('view').innerHTML=head('المستخدمون والصلاحيات','تعديل كلمة السر وفصل العمليات الأساسية عن الحساسة',`<button class="btn btn-primary" onclick="userModal()"><i data-lucide="user-plus"></i> مستخدم جديد</button>`)+`<div class="card permissions-card"><div class="table-wrap"><table class="table"><thead><tr><th>المستخدم</th><th>الدور</th><th>الصلاحيات</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${data.users.map((user,index)=>{ensurePermissions(user);return `<tr><td><b>${esc(user.name)}</b><br><small class="muted">${esc(user.username)}</small></td><td><span class="status info">${esc(user.role)}</span></td><td>${user.role==='مدير'?'كل الصلاحيات':user.permissions.length+' صلاحية'}</td><td><span class="status ${user.active?'ok':'out'}">${user.active?'نشط':'موقوف'}</span></td><td><button class="btn btn-primary" onclick="editUserAccount(${index})">تعديل المستخدم</button> <button class="btn btn-soft" onclick="toggleUser(${index})">${user.active?'إيقاف':'تفعيل'}</button></td></tr>`}).join('')}</tbody></table></div></div>`;icon()};
window.directUsersRenderer=renderUsers;
const finalRender=render;render=function(){if(window.hasPermission&&!hasPermission(current))current='dashboard';finalRender();if(window.hasPermission){document.querySelectorAll('#nav button').forEach(b=>b.style.display=hasPermission(b.dataset.page)?'flex':'none');const pdf=document.getElementById('utilityPdf'),excel=document.getElementById('utilityExcel');if(pdf)pdf.style.display=hasPermission('pdf')?'':'none';if(excel)excel.style.display=hasPermission('excel')?'':'none';const rules=[[/exportCurrentExcel|downloadExcel/,'excel'],[/exportCurrentPdf|printReport|printCart|printShiftReport/,'pdf'],[/share.*WhatsApp/,'whatsapp'],[/addProductModal|adjustStock|editRetailData|deleteProduct/,'inventory'],[/purchaseModal|savePurchase/,'purchases'],[/supplierModal|saveSupplier|deleteSupplier/,'suppliers'],[/supplierVoucher|saveVoucher/,'accounts'],[/processReturn|renderReturns/,'returns'],[/expenseModal|saveExpense/,'expenses'],[/customerModal|customerPayment/,'customers'],[/saveStocktake|renderStocktake/,'stocktake'],[/openShift|closeShift/,'shifts'],[/userModal|editUserPermissions|toggleUser|removeUser/,'users']];document.querySelectorAll('#view button').forEach(button=>{const code=button.getAttribute('onclick')||'';const rule=rules.find(([pattern])=>pattern.test(code));if(rule)button.style.display=hasPermission(rule[1])?'':'none';});}};
if(data.activated){document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render();syncGoogleSheet()}else icon();
const existingSaveSupplier=saveSupplier;
saveSupplier=function(){const name=String(document.getElementById('sName')?.value||'').trim().toLowerCase(),code=String(document.getElementById('sCode')?.value||'').trim().toLowerCase();if(data.suppliers.some(s=>String(s.name||'').trim().toLowerCase()===name||String(s.code||'').trim().toLowerCase()===code)){toast('المورد موجود بالفعل بالاسم أو الكود');return}existingSaveSupplier();};
function selectSupplierForPurchase(){const supplier=data.suppliers.find(s=>String(s.id)===String(document.getElementById('buySupplierSelect')?.value));const code=document.getElementById('buySupplierCode'),name=document.getElementById('buySupplierName');if(code)code.value=supplier?.code||'';if(name)name.value=supplier?.name||'';}
purchaseModal=function(){if(!data.suppliers.length){toast('أضف المورد أولاً من شاشة الموردين');return}showModal('تسجيل توريد',`<div class="supplier-purchase-grid"><div class="field"><label>اختيار المورد</label><select id="buySupplierSelect" class="input" onchange="selectSupplierForPurchase()"><option value="">اختر موردًا</option>${data.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.code)}</option>`).join('')}</select></div><div class="field"><label>كود المورد</label><input id="buySupplierCode" class="input" readonly></div><div class="field"><label>اسم المورد</label><input id="buySupplierName" class="input" readonly></div><div class="field supplier-invoice-field"><label>رقم فاتورة المورد</label><input id="buyInvoiceNo" class="input" placeholder="رقم الفاتورة"></div></div><div class="field"><label>الدواء / الصنف</label><select id="buyProduct" class="input">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>عدد العلب / الوحدات</label><input id="buyQty" class="input" type="number" min="1" value="1"></div><div class="field"><label>تكلفة الوحدة</label><input id="buyPrice" class="input" type="number" min="0" value="0"></div><div class="field"><label>المدفوع الآن</label><input id="buyPaid" class="input" type="number" min="0" value="0"></div></div><div class="modal-actions"><button class="btn btn-primary" onclick="savePurchase()">حفظ التوريد والحساب</button><button class="btn btn-soft" onclick="closeModal()">إلغاء</button></div>`)};
savePurchase=function(){const supplier=data.suppliers.find(s=>String(s.id)===String(document.getElementById('buySupplierSelect')?.value)),p=data.products.find(x=>x.id==document.getElementById('buyProduct')?.value),qty=Number(document.getElementById('buyQty')?.value),price=Number(document.getElementById('buyPrice')?.value),paid=Number(document.getElementById('buyPaid')?.value)||0,invoiceNo=document.getElementById('buyInvoiceNo')?.value.trim(),total=qty*price;if(!supplier){toast('اختر موردًا مسجلًا أولاً');return}if(!invoiceNo){toast('أدخل رقم فاتورة المورد');return}if(!p||qty<=0||price<0||paid<0||paid>total){toast('تحقق من بيانات التوريد والمدفوع');return}const date=new Date().toISOString(),id=String(Date.now()).slice(-7);p.stockBase+=(p.stripsPerPack||1)*(p.tabletsPerStrip||1)*qty;p.stock=Math.floor(p.stockBase/((p.stripsPerPack||1)*(p.tabletsPerStrip||1)));data.purchases.push({id,date,invoiceNo,supplierId:supplier.id,supplierCode:supplier.code,supplierName:supplier.name,lines:[{name:p.name,qty}],total,paid});data.supplierTransactions.push({id:Date.now()+1,supplierId:supplier.id,kind:'purchase',amount:total,note:'فاتورة مورد '+invoiceNo,date,invoiceNo});if(paid)data.supplierTransactions.push({id:Date.now()+2,supplierId:supplier.id,kind:'payment',amount:paid,note:'مدفوع لفاتورة '+invoiceNo,date,invoiceNo});save();closeModal();renderPurchases();downloadExcel('تم تسجيل التوريد وتحديث حساب المورد')};
getGoogleSheetUrl=function(){return String(data.googleSheetUrl||GOOGLE_SHEET_URL||'').trim()};
syncGoogleSheet=async function(){const url=getGoogleSheetUrl();if(!url){googleSyncState='الرابط غير مضبوط';updateUtilityBar();return false}if(googleSyncInFlight){googleSyncQueued=true;return false}googleSyncInFlight=true;googleSyncState='جاري الإرسال';updateUtilityBar();const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);try{await fetch(url,{method:'POST',mode:'no-cors',signal:controller.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({source:'صيدليتي',savedAt:new Date().toISOString(),data})});googleSyncState='تم الإرسال إلى Google Sheets';googleLastSync=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});googleRetryDelay=5000;return true}catch(error){googleSyncState='تعذر الإرسال - إعادة محاولة';scheduleGoogleRetry();return false}finally{clearTimeout(timeout);googleSyncInFlight=false;updateUtilityBar();if(googleSyncQueued){googleSyncQueued=false;queueGoogleSync()}}};
</script>
</body></html>
